version: '3.8'

services:
  render-worker:
    build: .
    container_name: flux-post-render-worker
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - /tmp:/tmp
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'node index.js' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    # O worker não expõe portas públicas
    network_mode: "host"
